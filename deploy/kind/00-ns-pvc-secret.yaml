# HotPod on kind — namespace, storage, token
# (test.sh applies this; values tuned for a single-node kind cluster)
---
apiVersion: v1
kind: Namespace
metadata:
  name: hotpod-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint
  namespace: hotpod-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: hotpod-token
  namespace: hotpod-demo
type: Opaque
stringData:
  HOTPOD_TOKEN: "kind-demo-token"
