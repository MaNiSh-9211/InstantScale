# Sets vm.unprivileged_userfaultfd=1 on every node so HotPod pods can use
# userfaultfd WITHOUT privileged mode. Apply once per cluster; pods then run
# with capabilities: none (see 20-pageserver.yaml / 31-scale-hot-job.yaml).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hotpod-sysctl
  namespace: kube-system
  labels: { app: hotpod-sysctl }
spec:
  selector:
    matchLabels: { app: hotpod-sysctl }
  template:
    metadata:
      labels: { app: hotpod-sysctl }
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          securityContext: { privileged: true }
          command: ["sh", "-c",
                    "sysctl -w vm.unprivileged_userfaultfd=1"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
