name: criu-native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  criu-from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install CRIU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libprotobuf-c-dev protobuf-c-compiler libprotobuf-dev \
            protobuf-compiler \
            libnl-3-dev libnet1-dev libcap-dev uuid-dev \
            python3-minimal python3-protobuf

      - name: Build CRIU from source
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/checkpoint-restore/criu.git /tmp/criu-src
          cd /tmp/criu-src
          make -j"$(nproc)" >/dev/null
          test -x criu/criu
          echo "/tmp/criu-src/criu" >> "$GITHUB_PATH"

      - name: CRIU sanity
        run: |
          criu --version
          sudo sysctl -w vm.unprivileged_userfaultfd=1 || true
          # CRIU must ptrace its target; Yama restricts to parent->child only.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Grant checkpoint capability
        run: sudo setcap cap_checkpoint_restore+eip /tmp/criu-src/criu/criu

      - name: Dump/restore a live process (sleep)
        run: |
          sleep 500 & SP=$!
          mkdir -p /tmp/cp/d
          criu dump --unprivileged -D /tmp/cp/d -t $SP --shell-job -o /tmp/cp/dump.log -v1 \
            || { echo "--- dump.log ---"; tail -n 30 /tmp/cp/dump.log; exit 1; }
          criu restore --unprivileged -D /tmp/cp/d --shell-job -d \
            --pidfile /tmp/cp/r.pid -o /tmp/cp/res.log -v1 \
            || { echo "--- res.log ---"; tail -n 30 /tmp/cp/res.log; exit 1; }
          sleep 0.3
          kill "$(cat /tmp/cp/r.pid)"
          echo "CRIU ROUNDTRIP OK"

      - name: Migrate demo_app via CRIU (state continuity)
        run: |
          make -C mvp clean all >/dev/null   # warms toolchain sanity
          make -C phase3 clean all >/dev/null
          HB=/tmp/hb.log; : >"$HB"
          ./phase3/demo_app --init-ms 400 --warm-mb 8 >>"$HB" 2>&1 &
          APP=$!
          until grep -q '^READY' "$HB"; do sleep 0.05; done
          sleep 0.4
          PRE=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")

          mkdir -p /tmp/cimg
          criu dump --unprivileged -D /tmp/cimg -t $APP --shell-job -o /tmp/cdump.log -v1

          criu restore --unprivileged -D /tmp/cimg --shell-job -d \
            --pidfile /tmp/r.pid -o /tmp/cres.log -v1
          sleep 0.8
          # File accumulates across both processes: LAST seq = restored one.
          POST=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")
          kill "$(cat /tmp/r.pid)" 2>/dev/null || true

          echo "pre_seq=$PRE post_seq=$POST"
          [ -n "$POST" ] && [ "$POST" -gt "$PRE" ] && echo "CRIU MIGRATION CONTINUITY OK"

      - name: CRIU lazy-pages roundtrip
        run: |
          CR=/tmp/criu-src/criu/criu
          # Entire lazy flow runs as ONE root shell: consistent ownership of
          # pidfiles/logs (mixing sudo/root and runner files caused flaky
          # permission failures and stale verdicts).
          sudo bash -s -- <<'LAZY'
            set -uo pipefail
            CR=/tmp/criu-src/criu/criu
            W=/tmp/lazy
            rm -rf "$W"; mkdir -p "$W/ps" "$W/dump"
            HB=$W/hb.log; : > "$HB"

            /src/phase3/demo_app --init-work-mb 64 --warm-mb 16 \
                --interval-ms 50 --hb-count 40 >> "$HB" 2>&1 &
            APP=$!
            until grep -q "^READY" "$HB"; do sleep 0.05; done
            until grep -q "^HB seq=2" "$HB"; do sleep 0.02; done
            PRE=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")

            $CR page-server --images $W/ps --address 127.0.0.1 \
                 --port 46333 --daemon --pidfile $W/ps.pid \
                 -o $W/ps.log -v1 || echo "[dbg] page-server rc=$?"

            $CR dump -D $W/dump --lazy-pages \
                 --page-server --address 127.0.0.1 --port 46333 \
                 -t $APP --shell-job -o $W/dump.log -v1 &
            DJ=$!
            for _ in $(seq 300); do
                [ -f $W/ps/pstree.img ] && break
                sleep 0.1
            done

            $CR restore --lazy-pages --page-server \
                 --address 127.0.0.1 --port 46333 --images $W/ps \
                 --shell-job -d --pidfile $W/r.pid \
                 -o $W/res.log -v1 || echo "[dbg] restore rc=$?"
            wait $DJ 2>/dev/null || true

            sleep 2
            POST=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")
            kill $(cat $W/r.pid 2>/dev/null) 2>/dev/null || true
            kill $(cat $W/ps.pid 2>/dev/null) 2>/dev/null || true

            echo "lazy pre_seq=$PRE post_seq=$POST"
            echo "--- res.log tail ---"; tail -n 8 $W/res.log 2>/dev/null || true
            echo "--- dump.log tail ---"; tail -n 8 $W/dump.log 2>/dev/null || true
            mkdir -p /tmp/lazy-logs
            cp $W/*.log "$HB" /tmp/lazy-logs/ 2>/dev/null || true

            if [ -n "$POST" ] && [ "$POST" -gt "$PRE" ]; then
                echo "CRIU LAZY PAGES OK"
                exit 0
            fi
            echo "CRIU LAZY PAGES: continuity not observed"
            exit 1
LAZY

      - name: Upload lazy-pages diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-lazy-logs
          path: /tmp/lazy-logs/
          if-no-files-found: ignore      - name: Upload lazy-pages diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-lazy-logs
          path: criu-lazy-logs/
          if-no-files-found: ignore
