name: criu-native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  criu-from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install CRIU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libprotobuf-c-dev protobuf-c-compiler libprotobuf-dev \
            protobuf-compiler \
            libnl-3-dev libnet1-dev libcap-dev uuid-dev \
            python3-minimal python3-protobuf

      - name: Build CRIU from source
        run: |
          git clone --depth 1 --branch v4.1 https://github.com/checkpoint-restore/criu.git /tmp/criu-src
          cd /tmp/criu-src
          make -j"$(nproc)" >/dev/null
          test -x criu/criu
          echo "/tmp/criu-src/criu" >> "$GITHUB_PATH"

      - name: CRIU sanity
        run: |
          criu --version
          sudo sysctl -w vm.unprivileged_userfaultfd=1 || true
          # CRIU must ptrace its target; Yama restricts to parent->child only.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Grant checkpoint capability
        run: sudo setcap cap_checkpoint_restore+eip /tmp/criu-src/criu/criu

      - name: Dump/restore a live process (sleep)
        run: |
          sleep 500 & SP=$!
          mkdir -p /tmp/cp/d
          criu dump --unprivileged -D /tmp/cp/d -t $SP --shell-job -o /tmp/cp/dump.log -v1 \
            || { echo "--- dump.log ---"; tail -n 30 /tmp/cp/dump.log; exit 1; }
          criu restore --unprivileged -D /tmp/cp/d --shell-job -d \
            --pidfile /tmp/cp/r.pid -o /tmp/cp/res.log -v1 \
            || { echo "--- res.log ---"; tail -n 30 /tmp/cp/res.log; exit 1; }
          sleep 0.3
          kill "$(cat /tmp/cp/r.pid)"
          echo "CRIU ROUNDTRIP OK"

      - name: Migrate demo_app via CRIU (state continuity)
        run: |
          make -C mvp clean all >/dev/null   # warms toolchain sanity
          make -C phase3 clean all >/dev/null
          HB=/tmp/hb.log; : >"$HB"
          ./phase3/demo_app --init-ms 400 --warm-mb 8 >>"$HB" 2>&1 &
          APP=$!
          until grep -q '^READY' "$HB"; do sleep 0.05; done
          sleep 0.4
          PRE=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")

          mkdir -p /tmp/cimg
          criu dump --unprivileged -D /tmp/cimg -t $APP --shell-job -o /tmp/cdump.log -v1

          criu restore --unprivileged -D /tmp/cimg --shell-job -d \
            --pidfile /tmp/r.pid -o /tmp/cres.log -v1
          sleep 0.8
          # File accumulates across both processes: LAST seq = restored one.
          POST=$(awk '$1=="HB"{split($2,a,"=");s=a[2]}END{print s+0}' "$HB")
          kill "$(cat /tmp/r.pid)" 2>/dev/null || true

          echo "pre_seq=$PRE post_seq=$POST"
          [ -n "$POST" ] && [ "$POST" -gt "$PRE" ] && echo "CRIU MIGRATION CONTINUITY OK"

      - name: Build demo_app
        run: make -C phase3 clean all

      - name: CRIU lazy-pages roundtrip
        run: sudo bash .dev/criu_lazy_flow.sh

      - name: Collect lazy diagnostics
        if: always()
        run: |
          mkdir -p criu-lazy-logs
          sudo cp -r /tmp/lazy-logs/. criu-lazy-logs/ 2>/dev/null || true
          sudo chmod -R a+r criu-lazy-logs 2>/dev/null || true

      - name: Upload lazy-pages diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-lazy-logs
          path: criu-lazy-logs/
          if-no-files-found: ignore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criu-lazy-logs
          path: /tmp/lazy-logs/
