# InstantScale - two-host lazy migration stack
# Up:   docker compose up --build -d
# Logs: docker compose logs -f target
# Down: docker compose down
#
# The target activates lazily; its pages cross the compose network.
# Heartbeats/checkpoint land in ./artifacts (bind mount).
# Set a real token in production:  $env:HOTPOD_TOKEN="<random>" before up.

services:
  source:
    build:
      context: .
      dockerfile: .dev/Dockerfile
    image: hotpod-devel
    container_name: hotpod-src
    privileged: true            # userfaultfd is blocked by default seccomp
    volumes:
      - .:/src
    working_dir: /src
    environment:
      INIT_WORK_MB: "256"
      HEAP_MB: "32"
      PORT: "46100"
      HOTPOD_TOKEN: "${HOTPOD_TOKEN:-dev-only-change-me}"
    command: bash /src/phase4/source_node.sh

  target:
    image: hotpod-devel
    privileged: true
    volumes:
      - .:/src
    working_dir: /src
    depends_on: [source]        # target_node.sh polls for the checkpoint file
    environment:
      HOTPOD_TOKEN: "${HOTPOD_TOKEN:-dev-only-change-me}"
    command: bash /src/phase4/target_node.sh source 46100 lazy
